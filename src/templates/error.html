<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка {{ status_code }}</title>
    <link rel="icon" href="/static/favicon.png">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="error-container">
        <!-- Крупный код статуса (401, 404 и т.д.) -->
        <div class="error-code">{{ status_code }}</div>
        
        <h2>Что-то пошло не так</h2>
        
        <!-- Сообщение об ошибке -->
        <div class="error-message">
            {{ detail }}
        </div>
        
        <!-- Стилизованная ссылка под вашу submit-btn кнопка возврата -->
        <a href="/Service/Main" class="action-btn">Вернуться на главную</a>
        
        <div class="error-footer">
            Если вы считаете, что это ошибка сервера, пожалуйста, <a href="/Service/Main">свяжитесь с нами</a>.
        </div>
    </div>

</body>
</html>
